<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Peerbound Intro</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    background: #0d0224;
    position: relative;
  }

  /* ── BACKGROUND LAYERS ── */
  .bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(170deg, #160340 0%, #0d0224 40%, #2a0a52 100%);
    z-index: 0;
  }

  /* Multiple animated light orbs for living background */
  .bg-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 1;
    pointer-events: none;
  }
  .bg-orb-1 {
    width: 700px; height: 700px;
    bottom: 100px; right: -200px;
    background: radial-gradient(circle, rgba(254,71,89,0.12) 0%, transparent 70%);
    animation: orbFloat1 10s ease-in-out infinite alternate;
  }
  .bg-orb-2 {
    width: 500px; height: 500px;
    top: 200px; left: -100px;
    background: radial-gradient(circle, rgba(88,40,180,0.15) 0%, transparent 70%);
    animation: orbFloat2 12s ease-in-out infinite alternate;
  }
  .bg-orb-3 {
    width: 600px; height: 600px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(254,71,89,0.06) 0%, transparent 70%);
    animation: orbFloat3 8s ease-in-out infinite alternate;
  }
  .bg-orb-4 {
    width: 400px; height: 400px;
    bottom: 500px; left: 200px;
    background: radial-gradient(circle, rgba(60,20,140,0.12) 0%, transparent 70%);
    animation: orbFloat4 14s ease-in-out infinite alternate;
  }

  @keyframes orbFloat1 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-80px, -60px) scale(1.15); }
  }
  @keyframes orbFloat2 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(50px, 80px) scale(0.9); }
  }
  @keyframes orbFloat3 {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    100% { transform: translate(-45%, -55%) scale(1.2); opacity: 1; }
  }
  @keyframes orbFloat4 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(40px, -50px) scale(1.1); }
  }

  /* Vignette overlay */
  .vignette {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse 70% 60% at 50% 45%, transparent 0%, rgba(6,1,18,0.5) 70%, rgba(6,1,18,0.85) 100%);
  }

  /* Film grain */
  .grain {
    position: absolute;
    inset: 0;
    z-index: 999;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 512px 512px;
    animation: grainShift 0.15s steps(4) infinite;
  }

  @keyframes grainShift {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-12px, 18px); }
    50% { transform: translate(8px, -14px); }
    75% { transform: translate(-6px, -8px); }
    100% { transform: translate(14px, 6px); }
  }

  /* ── CANVAS LAYERS ── */
  #bgCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 1080px; height: 1920px;
    z-index: 3;
    pointer-events: none;
  }
  #particleCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 1080px; height: 1920px;
    z-index: 5;
    pointer-events: none;
  }
  #bloomCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 1080px; height: 1920px;
    z-index: 6;
    pointer-events: none;
    opacity: 0.35;
    filter: blur(16px);
    mix-blend-mode: screen;
  }

  /* ── LIGHT LEAKS ── */
  .light-leak {
    position: absolute;
    inset: 0;
    z-index: 8;
    pointer-events: none;
    opacity: 0;
    overflow: hidden;
  }
  .light-leak-inner {
    position: absolute;
    width: 400px;
    height: 1920px;
    top: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(254,71,89,0.08) 30%, rgba(255,200,180,0.12) 50%, rgba(254,71,89,0.08) 70%, transparent 100%);
    filter: blur(30px);
    transform: translateX(-500px) skewX(-8deg);
  }

  /* ── SCENE CONTAINERS ── */
  .scene-1, .scene-2, .scene-3 {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 90px;
    opacity: 0;
    pointer-events: none;
  }

  .scene-1 {
    z-index: 10;
    padding-bottom: 200px;
  }

  .scene-2 {
    z-index: 30;
  }

  .scene-3 {
    z-index: 40;
    padding-bottom: 160px;
  }

  /* Slide-up mask wrappers */
  .s1, .s3 {
    overflow: hidden;
    line-height: 1;
    text-align: center;
    width: 100%;
  }

  .s1 .t, .s3 .t {
    display: block;
    transform: translateY(105%);
    will-change: transform;
  }

  /* ── SCENE 1 TYPOGRAPHY ── */
  .s1-we-asked .t {
    font-size: 88px;
    font-weight: 800;
    color: rgba(248,248,251,0.4);
    letter-spacing: -0.04em;
  }

  .s1-our .t {
    font-size: 88px;
    font-weight: 800;
    color: rgba(248,248,251,0.4);
    letter-spacing: -0.04em;
  }

  .s1-customers .t {
    font-size: 156px;
    font-weight: 900;
    color: #fe4759;
    letter-spacing: -0.05em;
  }

  .s1-about .t {
    font-size: 72px;
    font-weight: 600;
    color: rgba(248,248,251,0.15);
    letter-spacing: -0.04em;
  }

  .s1-peerbound .t {
    font-size: 138px;
    font-weight: 900;
    color: #f8f8fb;
    letter-spacing: -0.045em;
  }

  /* Coral underline */
  .brand-line {
    width: 0;
    height: 10px;
    background: #fe4759;
    border-radius: 5px;
    margin-top: 12px;
    box-shadow: 0 0 20px rgba(254,71,89,0.4), 0 0 60px rgba(254,71,89,0.15);
    will-change: width;
  }

  /* ── FLASH OVERLAY ── */
  .flash-overlay {
    position: absolute;
    inset: 0;
    background: #fe4759;
    z-index: 29;
    opacity: 0;
    pointer-events: none;
  }

  /* ── SHOCKWAVE ── */
  .shockwave {
    position: absolute;
    z-index: 31;
    pointer-events: none;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    border: 3px solid rgba(254,71,89,0.6);
    box-shadow: 0 0 30px rgba(254,71,89,0.3), inset 0 0 30px rgba(254,71,89,0.1);
    transform: translate(-50%, -50%);
    opacity: 0;
  }

  /* ── CHROMATIC ABERRATION / GLITCH ── */
  .glitch-layer {
    position: absolute;
    inset: 0;
    z-index: 32;
    pointer-events: none;
    opacity: 0;
    overflow: hidden;
  }
  .glitch-line {
    position: absolute;
    width: 100%;
    height: 3px;
    background: rgba(254,71,89,0.4);
    filter: blur(1px);
  }

  /* ── SCENE 2 ── */
  .scene-2-anchor {
    position: absolute;
    inset: 0;
    z-index: 30;
    pointer-events: none;
  }

  .scene-2 {
    text-align: center;
  }

  .s2-just, .s2-kidding {
    font-size: 232px;
    font-weight: 900;
    line-height: 0.82;
    letter-spacing: -0.06em;
    opacity: 0;
    transform: scale(3);
    will-change: transform, opacity;
  }

  .s2-just {
    color: #f8f8fb;
  }

  .s2-kidding {
    color: #fe4759;
  }

  .s2-period {
    color: #f8f8fb;
    opacity: 0;
    display: inline-block;
    transform: scale(4) translateY(-20px);
    will-change: transform, opacity;
  }

  /* ── SCENE 3 TYPOGRAPHY ── */
  .s3-they-were .t {
    font-size: 88px;
    font-weight: 800;
    color: rgba(248,248,251,0.4);
    letter-spacing: -0.04em;
  }

  .s3-already .t {
    font-size: 168px;
    font-weight: 900;
    color: #fe4759;
    letter-spacing: -0.055em;
    text-shadow: 0 0 60px rgba(254,71,89,0.25);
  }

  .s3-talking .t {
    font-size: 168px;
    font-weight: 900;
    color: #f8f8fb;
    letter-spacing: -0.055em;
  }

  .s3-about-it .t {
    font-size: 88px;
    font-weight: 800;
    color: rgba(248,248,251,0.4);
    letter-spacing: -0.04em;
  }

  /* Scene 3 left accent bar */
  .s3-bar {
    position: absolute;
    left: 58px;
    top: 50%;
    transform: translateY(-50%);
    width: 8px;
    height: 0;
    background: #fe4759;
    border-radius: 4px;
    box-shadow: 0 0 30px rgba(254,71,89,0.25);
    will-change: height;
  }

  /* ── OUTRO ── */
  .outro {
    position: absolute;
    inset: 0;
    background: #000;
    z-index: 60;
    opacity: 0;
    pointer-events: none;
  }

  /* ── KEYFRAMES ── */
  @keyframes shakeIt {
    0%   { transform: translate(0, 0) rotate(0deg); }
    8%   { transform: translate(-18px, 8px) rotate(-0.8deg); }
    16%  { transform: translate(15px, -12px) rotate(0.6deg); }
    24%  { transform: translate(-12px, 6px) rotate(-0.5deg); }
    32%  { transform: translate(10px, -8px) rotate(0.4deg); }
    40%  { transform: translate(-8px, 5px) rotate(-0.3deg); }
    50%  { transform: translate(5px, -3px) rotate(0.2deg); }
    60%  { transform: translate(-4px, 3px) rotate(-0.15deg); }
    70%  { transform: translate(3px, -2px) rotate(0.1deg); }
    80%  { transform: translate(-2px, 1px) rotate(-0.05deg); }
    90%  { transform: translate(1px, -1px) rotate(0deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  @keyframes slamIn {
    0%   { transform: scale(3); opacity: 0; }
    55%  { transform: scale(0.94); opacity: 1; }
    75%  { transform: scale(1.02); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes periodBounce {
    0%   { transform: scale(4) translateY(-20px); opacity: 0; }
    60%  { transform: scale(0.8) translateY(4px); opacity: 1; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  @keyframes coralFlash {
    0%   { opacity: 0; }
    12%  { opacity: 0.85; }
    100% { opacity: 0; }
  }

  @keyframes shockwaveExpand {
    0%   { width: 0; height: 0; opacity: 0.8; border-width: 3px; }
    100% { width: 900px; height: 900px; opacity: 0; border-width: 1px; }
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.003); }
  }

  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 40px rgba(254,71,89,0.2), 0 0 80px rgba(254,71,89,0.08); }
    50%      { text-shadow: 0 0 60px rgba(254,71,89,0.35), 0 0 120px rgba(254,71,89,0.15); }
  }

  @keyframes glowPulseWhite {
    0%, 100% { text-shadow: 0 0 30px rgba(248,248,251,0.15), 0 0 60px rgba(248,248,251,0.06); }
    50%      { text-shadow: 0 0 50px rgba(248,248,251,0.25), 0 0 100px rgba(248,248,251,0.1); }
  }

  @keyframes barGlow {
    0%, 100% { box-shadow: 0 0 30px rgba(254,71,89,0.25), 0 0 60px rgba(254,71,89,0.1); }
    50%      { box-shadow: 0 0 45px rgba(254,71,89,0.4), 0 0 90px rgba(254,71,89,0.2); }
  }

  @keyframes lightLeakSweep {
    0%   { transform: translateX(-500px) skewX(-8deg); }
    100% { transform: translateX(1580px) skewX(-8deg); }
  }
</style>
</head>
<body>

<!-- Background layers -->
<div class="bg"></div>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>
<div class="bg-orb bg-orb-4"></div>
<div class="vignette"></div>
<div class="grain"></div>

<!-- Canvas layers -->
<canvas id="bgCanvas" width="1080" height="1920"></canvas>
<canvas id="particleCanvas" width="1080" height="1920"></canvas>
<canvas id="bloomCanvas" width="1080" height="1920"></canvas>

<!-- Light leak overlays -->
<div class="light-leak" id="lightLeak1">
  <div class="light-leak-inner"></div>
</div>
<div class="light-leak" id="lightLeak2">
  <div class="light-leak-inner"></div>
</div>

<!-- Scene 1 -->
<div class="scene-1" id="scene1">
  <div class="s1 s1-we-asked"><span class="t">We asked</span></div>
  <div class="s1 s1-our"><span class="t">our</span></div>
  <div class="s1 s1-customers"><span class="t" id="customersText">customers</span></div>
  <div class="s1 s1-about"><span class="t">about</span></div>
  <div class="s1 s1-peerbound"><span class="t" id="peerboundText">Peerbound</span></div>
  <div class="brand-line" id="brandLine"></div>
</div>

<!-- Flash overlay -->
<div class="flash-overlay" id="flashOverlay"></div>

<!-- Shockwave -->
<div class="shockwave" id="shockwave"></div>

<!-- Glitch lines -->
<div class="glitch-layer" id="glitchLayer">
  <div class="glitch-line" style="top: 38%"></div>
  <div class="glitch-line" style="top: 42%; height: 2px; background: rgba(248,248,251,0.3);"></div>
  <div class="glitch-line" style="top: 55%"></div>
  <div class="glitch-line" style="top: 58%; height: 1px; background: rgba(100,200,255,0.3);"></div>
  <div class="glitch-line" style="top: 63%"></div>
</div>

<!-- Scene 2 -->
<div class="scene-2-anchor" id="scene2Anchor">
  <div class="scene-2" id="scene2">
    <div class="s2-just" id="s2Just">Just</div>
    <div class="s2-kidding" id="s2Kidding">Kidding<span class="s2-period" id="s2Period">.</span></div>
  </div>
</div>

<!-- Scene 3 -->
<div class="scene-3" id="scene3">
  <div class="s3 s3-they-were"><span class="t">They were</span></div>
  <div class="s3 s3-already"><span class="t" id="alreadyText">already</span></div>
  <div class="s3 s3-talking"><span class="t" id="talkingText">talking</span></div>
  <div class="s3 s3-about-it"><span class="t">about it.</span></div>
  <div class="s3-bar" id="s3Bar"></div>
</div>

<!-- Outro -->
<div class="outro" id="outro"></div>

<script>
(function() {
  const EASE = 'cubic-bezier(0.19, 1, 0.22, 1)';
  const startTime = performance.now();

  function at(delayS, fn) {
    setTimeout(fn, delayS * 1000);
  }

  function reveal(selector, delayS, durationS) {
    at(delayS, () => {
      const span = document.querySelector(selector + ' .t');
      if (!span) return;
      span.style.transition = `transform ${durationS}s ${EASE}`;
      span.style.transform = 'translateY(0)';
    });
  }

  // ════════════════════════════════════════
  // SCENE 1
  // ════════════════════════════════════════
  const scene1 = document.getElementById('scene1');
  const brandLine = document.getElementById('brandLine');
  const customersText = document.getElementById('customersText');
  const peerboundText = document.getElementById('peerboundText');

  at(0.1, () => { scene1.style.opacity = '1'; });

  reveal('.s1-we-asked',   0.25, 0.6);
  reveal('.s1-our',        0.42, 0.6);
  reveal('.s1-customers',  0.60, 0.65);
  reveal('.s1-about',      0.85, 0.5);
  reveal('.s1-peerbound',  1.00, 0.65);

  // Keyword glow pulses after reveal
  at(1.3, () => {
    customersText.style.animation = 'glowPulse 3s ease-in-out infinite';
  });
  at(1.7, () => {
    peerboundText.style.animation = 'glowPulseWhite 3s ease-in-out infinite';
  });

  // Breathing micro-animation on scene 1 after all reveals
  at(1.8, () => {
    scene1.style.animation = 'breathe 4s ease-in-out infinite';
  });

  // Coral underline
  at(1.55, () => {
    brandLine.style.transition = `width 0.8s ${EASE}`;
    brandLine.style.width = '200px';
  });

  // Light leak transition out of Scene 1
  const lightLeak1 = document.getElementById('lightLeak1');
  at(2.8, () => {
    lightLeak1.style.opacity = '1';
    lightLeak1.querySelector('.light-leak-inner').style.animation = 'lightLeakSweep 0.9s ease-in-out forwards';
  });
  at(3.7, () => { lightLeak1.style.opacity = '0'; });

  // Scene 1 fade out
  at(3.1, () => {
    scene1.style.transition = 'opacity 0.5s ease';
    scene1.style.opacity = '0';
    scene1.style.animation = 'none';
  });

  // ════════════════════════════════════════
  // SCENE 2
  // ════════════════════════════════════════
  const flashOverlay = document.getElementById('flashOverlay');
  const scene2 = document.getElementById('scene2');
  const scene2Anchor = document.getElementById('scene2Anchor');
  const s2Just = document.getElementById('s2Just');
  const s2Kidding = document.getElementById('s2Kidding');
  const s2Period = document.getElementById('s2Period');
  const shockwave = document.getElementById('shockwave');
  const glitchLayer = document.getElementById('glitchLayer');

  // Flash
  at(3.65, () => {
    flashOverlay.style.animation = 'coralFlash 0.35s ease-out forwards';
    scene2.style.opacity = '1';
  });

  // "Just" slam
  at(3.7, () => {
    s2Just.style.animation = 'slamIn 0.35s cubic-bezier(0.22, 0.68, 0.31, 1.02) forwards';
  });

  // "Kidding" slam + shake + shockwave + glitch
  at(3.95, () => {
    s2Kidding.style.animation = 'slamIn 0.35s cubic-bezier(0.22, 0.68, 0.31, 1.02) forwards';
    scene2Anchor.style.animation = 'shakeIt 0.5s ease-out';

    // Shockwave ring
    shockwave.style.animation = 'shockwaveExpand 0.6s ease-out forwards';

    // Glitch flicker
    glitchLayer.style.opacity = '1';
    setTimeout(() => { glitchLayer.style.opacity = '0'; }, 60);
    setTimeout(() => { glitchLayer.style.opacity = '0.7'; }, 100);
    setTimeout(() => { glitchLayer.style.opacity = '0'; }, 150);
    setTimeout(() => { glitchLayer.style.opacity = '0.4'; }, 200);
    setTimeout(() => { glitchLayer.style.opacity = '0'; }, 240);
  });

  // Period bounce
  at(4.35, () => {
    s2Period.style.animation = 'periodBounce 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
  });

  // Breathing on Scene 2 hold
  at(4.7, () => {
    scene2.style.animation = 'breathe 3s ease-in-out infinite';
  });

  // Scene 2 fade out
  at(5.65, () => {
    scene2.style.transition = 'opacity 0.35s ease';
    scene2.style.opacity = '0';
    scene2.style.animation = 'none';
  });

  // Light leak into Scene 3
  const lightLeak2 = document.getElementById('lightLeak2');
  at(5.7, () => {
    lightLeak2.style.opacity = '1';
    lightLeak2.querySelector('.light-leak-inner').style.animation = 'lightLeakSweep 1s ease-in-out forwards';
  });
  at(6.7, () => { lightLeak2.style.opacity = '0'; });

  // ════════════════════════════════════════
  // SCENE 3
  // ════════════════════════════════════════
  const scene3 = document.getElementById('scene3');
  const s3Bar = document.getElementById('s3Bar');
  const alreadyText = document.getElementById('alreadyText');
  const talkingText = document.getElementById('talkingText');

  at(6.05, () => {
    scene3.style.transition = 'opacity 0.5s ease';
    scene3.style.opacity = '1';
  });

  reveal('.s3-they-were', 6.15, 0.6);
  reveal('.s3-already',   6.45, 0.65);
  reveal('.s3-talking',   6.80, 0.65);
  reveal('.s3-about-it',  7.10, 0.6);

  // Keyword glow pulses in Scene 3
  at(7.15, () => {
    alreadyText.style.animation = 'glowPulse 3s ease-in-out infinite';
  });
  at(7.5, () => {
    talkingText.style.animation = 'glowPulseWhite 3s ease-in-out infinite';
  });

  // Breathing on Scene 3
  at(7.8, () => {
    scene3.style.animation = 'breathe 4s ease-in-out infinite';
  });

  // Left accent bar
  at(7.35, () => {
    s3Bar.style.transition = `height 0.8s ${EASE}`;
    s3Bar.style.height = '360px';
  });
  // Bar glow pulse after it grows
  at(8.2, () => {
    s3Bar.style.animation = 'barGlow 2.5s ease-in-out infinite';
  });

  // ════════════════════════════════════════
  // OUTRO
  // ════════════════════════════════════════
  const outro = document.getElementById('outro');
  at(9.6, () => {
    outro.style.transition = 'opacity 0.9s ease';
    outro.style.opacity = '1';
  });

  // ════════════════════════════════════════
  // CANVAS: AMBIENT BOKEH DUST (bgCanvas)
  // ════════════════════════════════════════
  const bgCanvas = document.getElementById('bgCanvas');
  const bgCtx = bgCanvas.getContext('2d');

  const DUST_COUNT = 120;
  const dustParticles = [];
  for (let i = 0; i < DUST_COUNT; i++) {
    dustParticles.push({
      x: Math.random() * 1080,
      y: Math.random() * 1920,
      size: 1 + Math.random() * 3,
      opacity: 0.03 + Math.random() * 0.12,
      speedX: (Math.random() - 0.5) * 0.15,
      speedY: -(0.05 + Math.random() * 0.2),
      phase: Math.random() * Math.PI * 2,
      phaseSpeed: 0.3 + Math.random() * 0.5
    });
  }

  function renderDust(elapsed) {
    bgCtx.clearRect(0, 0, 1080, 1920);
    for (const d of dustParticles) {
      d.x += d.speedX + Math.sin(elapsed * d.phaseSpeed + d.phase) * 0.08;
      d.y += d.speedY;

      // Wrap around
      if (d.y < -10) { d.y = 1930; d.x = Math.random() * 1080; }
      if (d.x < -10) d.x = 1090;
      if (d.x > 1090) d.x = -10;

      const flicker = 0.7 + 0.3 * Math.sin(elapsed * 1.5 + d.phase);
      const op = d.opacity * flicker;

      bgCtx.beginPath();
      bgCtx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
      bgCtx.fillStyle = `rgba(248, 248, 251, ${op})`;
      bgCtx.shadowBlur = d.size * 4;
      bgCtx.shadowColor = `rgba(248, 248, 251, ${op * 0.4})`;
      bgCtx.fill();
    }
    bgCtx.shadowBlur = 0;
  }

  // ════════════════════════════════════════
  // CANVAS: PARTICLES + WAVEFORM (particleCanvas)
  // ════════════════════════════════════════
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');

  // Waveform config
  const WAVEFORM_Y = 1402;
  const WAVEFORM_BAR_COUNT = 70;
  const WAVEFORM_BAR_WIDTH = 7;
  const WAVEFORM_PADDING = 80;
  const WAVEFORM_SPAN = 1080 - WAVEFORM_PADDING * 2;
  const WAVEFORM_BAR_GAP = WAVEFORM_SPAN / WAVEFORM_BAR_COUNT;

  const waveformBars = [];
  for (let i = 0; i < WAVEFORM_BAR_COUNT; i++) {
    const normalizedPos = i / (WAVEFORM_BAR_COUNT - 1);
    const envelope = Math.sin(normalizedPos * Math.PI);
    waveformBars.push({
      x: WAVEFORM_PADDING + i * WAVEFORM_BAR_GAP + WAVEFORM_BAR_GAP / 2,
      currentHeight: 0,
      targetHeight: 0,
      envelope: envelope,
      lastTargetChange: 0
    });
  }

  // Particles — doubled to 120
  const PARTICLE_COUNT = 120;
  let currentScene = 1;
  const particles = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const baseSize = 1.5 + Math.random() * 4.5;
    // Assign to a random waveform bar for spawning
    const barIndex = Math.floor(Math.random() * WAVEFORM_BAR_COUNT);
    const barX = waveformBars[barIndex].x;
    particles.push({
      x: barX + (Math.random() - 0.5) * 8,
      y: WAVEFORM_Y - (Math.random() * 30),
      baseSize: baseSize,
      size: baseSize,
      maxOpacity: 0.12 + Math.random() * 0.45,
      opacity: 0,
      speedY: -(0.2 + Math.random() * 0.45),
      life: Math.random(),
      lifeSpeed: 0.002 + Math.random() * 0.004,
      phase: Math.random() * Math.PI * 2,
      barIndex: barIndex,
      // Trail: store last few positions
      trail: [],
      trailLength: 2 + Math.floor(Math.random() * 4),
      // Scene 2 scatter
      scatterVX: 0,
      scatterVY: 0,
      scattered: false,
      // Scene 3 convergence
      targetX: 540 + (Math.random() - 0.5) * 300,
      targetY: 960 + (Math.random() - 0.5) * 200,
      converging: false,
      coralTransition: 0
    });
  }

  let scene2Entered = false;
  let scene3Entered = false;
  let scene3GlowOpacity = 0;

  function getElapsed() {
    return (performance.now() - startTime) / 1000;
  }

  function updateWaveform(elapsed) {
    let waveformOpacity = 0;
    let coralMode = false;

    if (elapsed < 3.1) {
      if (elapsed < 0.2) waveformOpacity = 0;
      else if (elapsed < 1.0) waveformOpacity = (elapsed - 0.2) / 0.8;
      else if (elapsed < 2.6) waveformOpacity = 1;
      else waveformOpacity = 1 - (elapsed - 2.6) / 0.5;
    } else if (elapsed > 7.5) {
      waveformOpacity = Math.min(1, (elapsed - 7.5) / 1.0);
      coralMode = true;
    }

    if (waveformOpacity <= 0) return;

    for (let i = 0; i < waveformBars.length; i++) {
      const bar = waveformBars[i];
      if (elapsed - bar.lastTargetChange > 0.3) {
        bar.targetHeight = (8 + Math.random() * 122) * bar.envelope;
        bar.lastTargetChange = elapsed;
      }
      bar.currentHeight += (bar.targetHeight - bar.currentHeight) * 0.08;
    }

    for (let i = 0; i < waveformBars.length; i++) {
      const bar = waveformBars[i];
      const h = bar.currentHeight;
      const x = bar.x - WAVEFORM_BAR_WIDTH / 2;
      const y = WAVEFORM_Y - h / 2;

      if (coralMode) {
        ctx.fillStyle = `rgba(254, 71, 89, ${waveformOpacity * 0.7})`;
        ctx.shadowBlur = 12;
        ctx.shadowColor = `rgba(254, 71, 89, ${waveformOpacity * 0.5})`;
      } else {
        ctx.fillStyle = `rgba(248, 248, 251, ${waveformOpacity * 0.35})`;
        ctx.shadowBlur = 4;
        ctx.shadowColor = `rgba(248, 248, 251, ${waveformOpacity * 0.15})`;
      }

      const r = 3;
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + WAVEFORM_BAR_WIDTH - r, y);
      ctx.quadraticCurveTo(x + WAVEFORM_BAR_WIDTH, y, x + WAVEFORM_BAR_WIDTH, y + r);
      ctx.lineTo(x + WAVEFORM_BAR_WIDTH, y + h - r);
      ctx.quadraticCurveTo(x + WAVEFORM_BAR_WIDTH, y + h, x + WAVEFORM_BAR_WIDTH - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function updateParticles(elapsed) {
    if (elapsed >= 3.65 && !scene2Entered) {
      scene2Entered = true;
      currentScene = 2;
      for (const p of particles) {
        const angle = Math.random() * Math.PI * 2;
        const force = 8 + Math.random() * 15;
        p.scatterVX = Math.cos(angle) * force;
        p.scatterVY = Math.sin(angle) * force;
        p.scattered = true;
        p.trail = [];
      }
    }

    if (elapsed >= 6.05 && !scene3Entered) {
      scene3Entered = true;
      currentScene = 3;
      for (const p of particles) {
        p.scattered = false;
        p.converging = true;
        p.opacity = 0;
        p.size = p.baseSize;
        p.x = Math.random() * 1080;
        p.y = Math.random() * 1920;
        p.coralTransition = 0;
        p.trail = [];
      }
    }

    for (const p of particles) {
      if (currentScene === 1) {
        p.life += p.lifeSpeed;
        if (p.life > 1) {
          // Reset — spawn from waveform bar tip
          p.life = 0;
          const bar = waveformBars[p.barIndex];
          p.x = bar.x + (Math.random() - 0.5) * 8;
          p.y = WAVEFORM_Y - bar.currentHeight / 2 - Math.random() * 5;
          p.phase = Math.random() * Math.PI * 2;
          p.trail = [];
        }

        const lifeRatio = p.life;
        let opacityMult;
        if (lifeRatio < 0.15) opacityMult = lifeRatio / 0.15;
        else if (lifeRatio > 0.6) opacityMult = 1 - (lifeRatio - 0.6) / 0.4;
        else opacityMult = 1;

        p.opacity = p.maxOpacity * opacityMult;
        p.size = p.baseSize * (1 - lifeRatio * 0.5);
        p.y += p.speedY;
        p.x += Math.sin(elapsed * 2 + p.phase) * 0.3;

        // Store trail
        p.trail.push({ x: p.x, y: p.y, op: p.opacity, sz: p.size });
        if (p.trail.length > p.trailLength) p.trail.shift();

        // Draw trail
        for (let t = 0; t < p.trail.length - 1; t++) {
          const pt = p.trail[t];
          const trailFade = (t + 1) / p.trail.length;
          const tOp = pt.op * trailFade * 0.3;
          if (tOp > 0.005) {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, Math.max(0.3, pt.sz * trailFade * 0.6), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(248, 248, 251, ${tOp})`;
            ctx.fill();
          }
        }

        // Draw main particle
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.5, p.size), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(248, 248, 251, ${p.opacity})`;
        ctx.shadowBlur = 12;
        ctx.shadowColor = `rgba(248, 248, 251, ${p.opacity * 0.5})`;
        ctx.fill();
        ctx.shadowBlur = 0;

      } else if (currentScene === 2) {
        if (p.scattered) {
          p.x += p.scatterVX;
          p.y += p.scatterVY;
          p.scatterVX *= 0.96;
          p.scatterVY *= 0.96;
          p.opacity *= 0.97;
          p.size *= 0.99;

          if (p.opacity > 0.01) {
            // Draw scatter trail
            p.trail.push({ x: p.x, y: p.y, op: p.opacity, sz: p.size });
            if (p.trail.length > 5) p.trail.shift();

            for (let t = 0; t < p.trail.length - 1; t++) {
              const pt = p.trail[t];
              const trailFade = (t + 1) / p.trail.length;
              const tOp = pt.op * trailFade * 0.4;
              ctx.beginPath();
              ctx.arc(pt.x, pt.y, Math.max(0.3, pt.sz * 0.5), 0, Math.PI * 2);
              ctx.fillStyle = `rgba(254, 71, 89, ${tOp})`;
              ctx.fill();
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, Math.max(0.5, p.size), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(248, 248, 251, ${p.opacity})`;
            ctx.shadowBlur = 8;
            ctx.shadowColor = `rgba(254, 71, 89, ${p.opacity * 0.6})`;
            ctx.fill();
            ctx.shadowBlur = 0;
          }
        }

      } else if (currentScene === 3) {
        const dx = p.targetX - p.x;
        const dy = p.targetY - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const speed = 0.008 + (1 / (dist + 50)) * 2;

        p.x += dx * speed;
        p.y += dy * speed;
        p.x += Math.sin(elapsed * 1.5 + p.phase) * 0.4;
        p.y += Math.cos(elapsed * 1.2 + p.phase * 1.3) * 0.3;

        p.coralTransition = Math.min(1, p.coralTransition + 0.015);

        const targetOpacity = dist < 80 ? Math.min(0.7, p.maxOpacity * 1.2) : p.maxOpacity * 1.2;
        p.opacity += (targetOpacity - p.opacity) * 0.03;

        const targetSize = dist < 80 ? p.baseSize * 1.3 : p.baseSize;
        p.size += (targetSize - p.size) * 0.05;

        // Trail for convergence
        p.trail.push({ x: p.x, y: p.y, op: p.opacity, sz: p.size });
        if (p.trail.length > p.trailLength) p.trail.shift();

        for (let t = 0; t < p.trail.length - 1; t++) {
          const pt = p.trail[t];
          const trailFade = (t + 1) / p.trail.length;
          const tOp = pt.op * trailFade * 0.25;
          if (tOp > 0.005) {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, Math.max(0.3, pt.sz * trailFade * 0.5), 0, Math.PI * 2);
            ctx.fillStyle = `rgba(254, 71, 89, ${tOp})`;
            ctx.fill();
          }
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.5, p.size), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(254, 71, 89, ${p.opacity})`;
        ctx.shadowBlur = 20;
        ctx.shadowColor = `rgba(254, 71, 89, ${p.opacity * 0.5})`;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // Scene 3 center glow
    if (elapsed > 8 && currentScene === 3) {
      scene3GlowOpacity = Math.min(0.08, scene3GlowOpacity + 0.0004);
      const gradient = ctx.createRadialGradient(540, 960, 0, 540, 960, 280);
      gradient.addColorStop(0, `rgba(254, 71, 89, ${scene3GlowOpacity})`);
      gradient.addColorStop(0.5, `rgba(254, 71, 89, ${scene3GlowOpacity * 0.4})`);
      gradient.addColorStop(1, 'rgba(254, 71, 89, 0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(200, 620, 680, 680);
    }

    // Scene 3 accent bar particles
    if (currentScene === 3 && elapsed > 8.2) {
      const barEl = document.getElementById('s3Bar');
      const barH = parseFloat(barEl.style.height) || 0;
      if (barH > 0) {
        const barCenterY = 960;
        const barTop = barCenterY - barH / 2;
        // Emit a few particles along the bar each frame
        const particleChance = 0.15;
        if (Math.random() < particleChance) {
          const py = barTop + Math.random() * barH;
          const px = 62;
          const pSize = 1 + Math.random() * 2;
          const pOp = 0.2 + Math.random() * 0.3;
          ctx.beginPath();
          ctx.arc(px, py, pSize, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(254, 71, 89, ${pOp})`;
          ctx.shadowBlur = 15;
          ctx.shadowColor = `rgba(254, 71, 89, ${pOp * 0.5})`;
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }
    }
  }

  // ════════════════════════════════════════
  // BLOOM POST-PROCESSING
  // ════════════════════════════════════════
  const bloomCanvas = document.getElementById('bloomCanvas');
  const bloomCtx = bloomCanvas.getContext('2d');

  function renderBloom() {
    bloomCtx.clearRect(0, 0, 1080, 1920);
    bloomCtx.drawImage(canvas, 0, 0);
  }

  // ════════════════════════════════════════
  // MAIN RENDER LOOP
  // ════════════════════════════════════════
  function render() {
    const elapsed = getElapsed();

    // Ambient dust
    renderDust(elapsed);

    // Main particles + waveform
    ctx.clearRect(0, 0, 1080, 1920);
    updateWaveform(elapsed);
    updateParticles(elapsed);

    // Bloom pass — copies particle canvas blurred on top
    renderBloom();

    if (elapsed < 12) {
      requestAnimationFrame(render);
    }
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
